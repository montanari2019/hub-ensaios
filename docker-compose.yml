services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub_ensaios
    ports:
      - '5432:5432'
    volumes:
      - hub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hub -d hub_ensaios']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hub_postgres_data:
